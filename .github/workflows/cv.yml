name: Build and deploy site and CV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up uv (runs the Typst PDF build)
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lint
        run: npm run lint

      - name: Unit tests (CV data, preview server, site logic)
        run: npm test

      - name: Build the landing site and PDF, then check both
        run: npm run check

      - name: Upload dist/ (landing site + PDF)
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  preview-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test preview startup on Windows
        run: node --test test/preview.test.mjs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, preview-windows]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
