    <meta name="color-scheme" content="light dark" />

    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <script>
      // Apply the saved theme and motion choice before first paint (keys from lib/ui.svelte.js).
      try {
        var theme = localStorage.getItem('ui:theme');
        if (theme === 'light' || theme === 'invert') document.documentElement.dataset.theme = theme;
        var motion = localStorage.getItem('ui:motion');
        if (motion === 'off') document.documentElement.dataset.motion = 'reduced';
        if (motion === 'on') document.documentElement.dataset.motion = 'full';
      } catch (error) {
        // Storage blocked: follow the system preferences.
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </head>
